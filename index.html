<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>집현전 데모 3안</title>
<style>
  :root { --ink: #0f1626; --sub: #5b6475; --line: #e3e6ec; --bg: #f6f7f9; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Pretendard", system-ui, -apple-system, "Malgun Gothic", sans-serif; color: var(--ink); background: var(--bg); word-break: keep-all; }
  main { max-width: 1080px; margin: 0 auto; padding: 72px 20px 96px; }
  h1 { margin: 0 0 8px; font-size: clamp(26px, 4vw, 36px); letter-spacing: -0.02em; }
  p.lead { margin: 0 0 40px; color: var(--sub); line-height: 1.7; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
  a.card { display: flex; flex-direction: column; background: #fff; border: 1px solid var(--line); border-radius: 18px; overflow: hidden; color: inherit; text-decoration: none; transition: transform .25s, box-shadow .25s; }
  a.card:hover { transform: translateY(-4px); box-shadow: 0 18px 40px rgba(15, 22, 38, .1); }
  .thumb { aspect-ratio: 16 / 10; background-size: cover; background-position: center; }
  .body { padding: 20px 22px 24px; }
  .tag { font-size: 12px; font-weight: 700; letter-spacing: .06em; }
  h2 { margin: 6px 0 8px; font-size: 20px; }
  .body p { margin: 0; color: var(--sub); font-size: 14px; line-height: 1.65; }
  @media (max-width: 860px) { .grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main>
  <h1>법무법인 집현전 의료전문센터 데모</h1>
  <p class="lead">같은 내용으로 디자인과 모션을 달리한 세 가지 안입니다.<br />각 안은 메인과 서브 페이지 전체가 연결되어 있습니다.</p>
  <div class="grid">
    <a class="card" href="01-navy-gold/index.html">
      <div class="thumb" style="background-image:url('01-navy-gold/img/insight-night.png')"></div>
      <div class="body"><span class="tag" style="color:#b08d45">1안</span><h2>네이비 골드</h2><p>딥네이비와 골드, 고정 인트로 히어로와 핀 섹션, 글래스 메가메뉴</p></div>
    </a>
    <a class="card" href="02-edu-light/index.html">
      <div class="thumb" style="background-image:url('02-edu-light/img/hero-01.png')"></div>
      <div class="body"><span class="tag" style="color:#2f5bff">2안</span><h2>라이트 블루</h2><p>밝은 화이트와 블루·민트, 대각선 오버레이 히어로와 스크롤 단계 섹션</p></div>
    </a>
    <a class="card" href="03-cinematic/index.html">
      <div class="thumb" style="background-image:url('03-cinematic/img/hero-poster.png')"></div>
      <div class="body"><span class="tag" style="color:#a3272d">3안</span><h2>시네마틱</h2><p>영상 히어로와 스티키 스테이지, 핀 겹침 전환, three.js 파티클</p></div>
    </a>
  </div>
</main>
</body>
</html>
